collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /g1/cmd_vel/authorized
    cmd_vel_out_topic: /cmd_vel
    state_topic: /g1/safety/collision_state
    transform_tolerance: 0.2
    # El valor oficial actual de Nav2 es 1,0 s. Con 0,5 s el RTX LiDAR de
    # Isaac alternó dato válido/vencido y anuló al controlador de quietud.
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false

    # Nav2 incluye el modelo predictivo "approach": no inventa una orden de
    # esquive, limita la velocidad si la trayectoria inmediata invade el
    # cuerpo. Lo combinamos con una zona de corte duro porque el bípedo medido
    # necesita una reserva física aun después de recibir velocidad cero.
    polygons: ["EmergencyStop", "FootprintApproach"]
    EmergencyStop:
      type: polygon
      action_type: stop
      # Approach redujo la velocidad pero el bípedo llegó a 0,396 m. Esta
      # reserva dura contempla 0,075 m entre barridos y 0,03 m de frenado.
      points: "[[0.55, 0.40], [0.55, -0.40], [-0.55, -0.40], [-0.55, 0.40]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: /g1/safety/emergency_stop_zone
    FootprintApproach:
      type: polygon
      action_type: approach
      # Unitree declara 0,45 m de ancho y 0,20 m de espesor. El margen lleva
      # la huella a 0,60 x 0,60 m para cubrir pies y balanceo sin fingir que
      # también cubre una carga; esa huella deberá cambiar con los brazos.
      points: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      # 1,2 s es el ejemplo de Nav2 para bases con ruedas. El G1 medido tarda
      # más en materializar una orden de freno; 2,0 s es el valor documentado
      # por defecto y debe conservar al menos 0,40 m hasta una pared.
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: true
      polygon_pub_topic: /g1/safety/approach_zone

    # Es la fuente predeterminada del ejemplo oficial de Collision Monitor.
    # Isaac 5.1 demora la nube 3D completa más que source_timeout; usarla aquí
    # alternaba movimiento y bloqueo. En el G1 real /scan deberá derivarse de
    # la nube del LiDAR Unitree, no de un segundo sensor físico.
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      source_timeout: 1.0
