# Esta secuencia es deliberadamente larga para dar tiempo a conectar el
# cliente de Isaac. No se usa para comparar métricas porque el renderizado
# agrega una carga que las corridas automáticas no tienen.
evaluation:
  task_name: "Velocity-Height-G1-Distillation-Recurrent-v0"
  num_envs: 1
  episode_length_s: 120.0
  num_episodes: 1
  env_overrides:
    events:
      disable_all: true
  environments:
    - env_ids: [0]
      name: "watch"
      schedule:
        - time: 0.0
          commands:
            base_velocity:
              lin_vel_x: 0.0
              lin_vel_y: 0.0
              ang_vel_z: 0.0
              base_height: 0.72
        - time: 10.0
          commands:
            base_velocity:
              lin_vel_x: 0.3
              lin_vel_y: 0.0
              ang_vel_z: 0.0
              base_height: 0.72
        - time: 35.0
          commands:
            base_velocity:
              lin_vel_x: 0.0
              lin_vel_y: 0.0
              ang_vel_z: 0.0
              base_height: 0.72
        - time: 60.0
          commands:
            base_velocity:
              lin_vel_x: 0.3
              lin_vel_y: 0.0
              ang_vel_z: 0.0
              base_height: 0.72
        - time: 85.0
          commands:
            base_velocity:
              lin_vel_x: 0.0
              lin_vel_y: 0.0
              ang_vel_z: 0.0
              base_height: 0.72
