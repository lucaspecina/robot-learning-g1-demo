# Esta prueba conserva intacta la física de NVIDIA para que la comparación
# discrimine el controlador completo y no una combinación de ajustes nuestros.
evaluation:
  task_name: "Velocity-Height-G1-Distillation-Recurrent-v0"
  num_envs: 1
  episode_length_s: 60.0
  num_episodes: 1
  env_overrides:
    events:
      disable_all: true
  environments:
    - env_ids: [0]
      name: "stand"
      schedule:
        - time: 0.0
          commands:
            base_velocity:
              lin_vel_x: 0.0
              lin_vel_y: 0.0
              ang_vel_z: 0.0
              base_height: 0.72
