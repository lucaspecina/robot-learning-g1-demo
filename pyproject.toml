[project]
name = "robot-learning-g1"
version = "0.1.0"
description = "Data, training and evaluation pipeline for G1 manipulation policies"
readme = "README.md"
# unitree_lerobot declares <3.11; LeRobot 0.4.1 needs >=3.10.
requires-python = ">=3.10,<3.11"
dependencies = [
    # Same version that the official unitree_lerobot pins as a submodule and
    # that loads our first ACT checkpoint.
    "lerobot==0.4.1",
    "unitree-lerobot",
    "opencv-python-headless>=4.9",
    "tyro>=0.9.10",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib>=3.9",
    "nbstripout>=0.9.1",
]

[tool.uv.sources]
# Cloned at a pinned commit by scripts/setup_learning.sh. Editable because its
# packaging only ships the top-level directory, not unitree_lerobot.utils.
unitree-lerobot = { path = "external/unitree_lerobot", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

[tool.pytest.ini_options]
testpaths = ["toolkit/tests"]
